[project]
name = "tahoe-transcriptomics-pipeline"
version = "0.1.0"
description = "Unsupervised machine learning pipeline for Tahoe-100M single-cell transcriptomics analysis."
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12"
]

[project.scripts]
tahoe-pipeline = "src.tahoe_pipeline:main"
tahoe-report = "src.make_report:main"
tahoe-evaluate = "src.evaluate_embeddings:main"

[tool.setuptools]
packages = ["src"]

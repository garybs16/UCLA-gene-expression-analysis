name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source files
        run: |
          python -m py_compile ucla_tahoe100m_pipeline_v2.py src/tahoe_pipeline.py src/make_report.py src/evaluate_embeddings.py tests/test_tahoe_pipeline.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests
